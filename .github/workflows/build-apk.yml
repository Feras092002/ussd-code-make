name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Android SDK مثبّت مسبقاً على ubuntu-latest؛ نكتفي بقبول التراخيص حتى يتمكن Gradle من تنزيل أي مكوّن ناقص
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build debug APK
        run: |
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ussd-code-maker.apk

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ussd-code-maker-debug-apk
          path: ussd-code-maker.apk

      # يُنشر الملف أيضاً كإصدار (Release) ليكون له رابط تنزيل مباشر وثابت
      - name: Publish APK as GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: USSD Code Maker — build ${{ github.run_number }}
          body: |
            نسخة Android من صانع كود USSD (commit ${{ github.sha }}).
            حمّل ملف ussd-code-maker.apk وثبّته على الهاتف.
          files: ussd-code-maker.apk
